name: ci

# ───────────────────────────────────────────────────────────────────────
# CI pipeline — runs on every push and every PR to main.
# Fast-fail: lint and unit tests gate the rest. Build + e2e run after.
# ───────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded runs on the same branch — saves minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write       # auto-fix needs to push commits
  pull-requests: write   # auto-fix needs to comment on PRs
  checks: write         # annotate test failures inline
  statuses: write

jobs:
  # ── 1. Lint: ktlint + detekt — fastest, runs in <2 minutes ─────────────
  lint:
    name: Lint (ktlint + detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run ktlintCheck (warn-only — does not fail build)
        run: ./gradlew ktlintCheck --no-daemon --stacktrace || true

      - name: Run detekt (warn-only — does not fail build)
        run: ./gradlew detekt --no-daemon --stacktrace || true

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: app/build/reports/detekt/
          retention-days: 14

  # ── 2. Unit tests — JVM, no emulator needed ────────────────────────────
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Generate coverage report
        run: ./gradlew koverXmlReport --no-daemon || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

  # ── 3. Build — cross-compile Rust → build APK (debug + release) ─────────
  build:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.1.10909125'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-aarch64-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: cargo-aarch64-

      - name: Build Rust core (aarch64-linux-android)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: bash scripts/build-prepare.sh

      - name: Compile Vulkan shaders
        run: python3 scripts/compile_shaders.py

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

  # ── 4. E2E instrumented tests on emulator — slowest, gate-able ─────────
  e2e-test:
    name: E2E instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit-test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.1.10909125'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-aarch64-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}

      - name: Build Rust core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: bash scripts/build-prepare.sh

      - name: Run instrumented tests on emulator (Pixel 6 / API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          script: ./gradlew connectedCheck --no-daemon --stacktrace

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: app/build/reports/androidTests/
          retention-days: 30
