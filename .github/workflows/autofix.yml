name: autofix

# ───────────────────────────────────────────────────────────────────────
# Auto-fix workflow — runs on PRs and pushes safe fixes back to the PR.
#
# v1 uses deterministic fixers (ktlintFormat, detekt autoCorrect, spotless).
# If the COPILOT_TOKEN secret is set, an additional AI pass attempts to fix
# lint errors that the deterministic tools cannot.
# ───────────────────────────────────────────────────────────────────────
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false  # let in-flight fixes finish to avoid races

jobs:
  format:
    name: ktlint + detekt autoCorrect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The default GITHUB_TOKEN can push back if it has `contents: write`.
          token: ${{ secrets.GH_PAT != 0 && secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Run ktlintFormat (auto-fix)
        run: ./gradlew ktlintFormat --no-daemon || true

      - name: Run detekt autoCorrect
        run: ./gradlew detekt --auto-correct --no-daemon || true

      - name: Sort imports
        run: ./gradlew spotlessApply --no-daemon || true

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit fixes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-fix (ktlint + detekt + spotless)

          Generated by .github/workflows/autofix.yml
          Run: ${{ github.run_id }}"
          git push

  ai-fix:
    name: AI auto-fix (optional — Copilot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: format
    # Only runs if the user has set COPILOT_TOKEN as a repo secret.
    if: ${{ secrets.COPILOT_TOKEN != 0 }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Re-run lint to find remaining issues
        run: ./gradlew detekt ktlintCheck --no-daemon > lint.txt 2>&1 || true

      - name: Use Copilot to fix remaining lint errors
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          pip install --quiet requests
          python3 scripts/ai_autofix.py --lint lint.txt --diff
          if git diff --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: AI auto-fix lint errors

            Generated by .github/workflows/autofix.yml (ai-fix job)
            Run: ${{ github.run_id }}"
            git push
          fi
